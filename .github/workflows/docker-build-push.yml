name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      aws-region:
        required: true
        type: string

      ecr-repository:
        required: true
        type: string

      role-to-assume:
        required: true
        type: string
      ecs-cluster:
        required: true
        type: string

      ecs-service:
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ inputs.aws-region }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:latest \
            .
      - name: Push Docker image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:latest
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ inputs.ecs-cluster }} \
            --service ${{ inputs.ecs-service }} \
            --force-new-deployment \
            --region ${{ inputs.aws-region }}

          aws ecs wait services-stable \
            --cluster ${{ inputs.ecs-cluster }} \
            --services ${{ inputs.ecs-service }} \
            --region ${{ inputs.aws-region }}
      - name: Output image URI
        run: |
          echo "Image pushed:"
          echo "${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:${{ github.sha }}"
